<text x="437" y="418" opacity="0" class="steplabel a27">/figure</text>
<g opacity="0" class="a28"><text x="437" y="444" class="caption">The agent describes the picture as data. It never writes SVG, and never a figure component.</text></g>
<g opacity="0" class="a29"><text x="437" y="444" class="caption">One command renders it: plain Node, no install, no browser, no build.</text></g>
<g opacity="0" class="a30"><text x="437" y="444" class="caption">Out comes one file that animates by itself — about 15 kB where a video was 2 MB.</text></g>
<g opacity="0" class="a31"><text x="437" y="444" class="caption">Commit it and link it: GitHub animates an SVG in markdown, with no upload and no click.</text></g>
<g opacity="0" class="a32"><text x="437" y="444" class="caption">The spec is the source: change a line, re-render, and the figure follows.</text></g>
